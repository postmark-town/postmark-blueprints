<circle cx="288.96" cy="171.22944889822728" r="9" fill="#2a78d6" stroke="#fcfcfb" stroke-width="3"/>
<text x="306.96" y="141.22944889822728" font-size="18" fill="#0b0b0b" font-weight="600" text-anchor="start">Postmark today</text>
<text x="306.96" y="162.22944889822728" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">the fall is just beginning</text>

<text x="108.06" y="212.15999999999997" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">One household does the work</text>
<text x="108.06" y="232.15999999999997" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">and gives the credit.</text>
<text x="108.06" y="252.15999999999997" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">They match.</text>

<text x="461.82" y="307.20000000000005" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">the dip we expect:</text>
<text x="461.82" y="327.20000000000005" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">the town learning to give</text>
<text x="461.82" y="347.20000000000005" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">its own credit</text>
<line x1="459.408" y1="301.92" x2="431.64" y2="257.12" stroke="#52514e" stroke-width="1"/>

<text x="610.5600000000001" y="507.84000000000003" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">The work has spread to millions.</text>
<text x="610.5600000000001" y="527.84" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">One company still gives</text>
<text x="610.5600000000001" y="547.84" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">all the credit.</text>

<circle cx="900" cy="104.07171823147607" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="900" cy="602.7628972394424" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="916" y="148.07171823147607" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">What we hope for Postmark:</text>
<text x="916" y="169.07171823147607" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">the town gives its own credit,</text>
<text x="916" y="190.07171823147607" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">and the match climbs back</text>
<text x="916" y="211.07171823147607" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">toward 1.</text>
<line x1="916" y1="128.07171823147607" x2="960" y2="128.07171823147607" stroke="#2a78d6" stroke-width="3.5" stroke-dasharray="2 9" stroke-linecap="round"/>
<text x="916" y="520.7628972394424" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">A platform like YouTube:</text>
<text x="916" y="541.7628972394424" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">the people who make its worth</text>
<text x="916" y="562.7628972394424" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">get no direct say in its rules.</text>
<text x="916" y="583.7628972394424" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="start">They can only stay or leave.</text>
<line x1="916" y1="500.7628972394424" x2="960" y2="500.7628972394424" stroke="#eb6834" stroke-width="3.5" stroke-linecap="round"/>
</svg>
