<text x="96" y="44" font-size="26" fill="#0b0b0b" font-weight="600" text-anchor="start">Credit and contribution, as the work spreads</text>
<text x="96" y="70" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">A sketch of the idea, not measured data.</text>

<line x1="96" y1="96" x2="900" y2="96" stroke="#e4e3df" stroke-width="1.5" stroke-dasharray="5 6"/>
<line x1="96" y1="360" x2="900" y2="360" stroke="#e4e3df" stroke-width="1"/>
<line x1="96" y1="624" x2="900" y2="624" stroke="#52514e" stroke-width="1.5"/>
<line x1="96" y1="624" x2="96" y2="74.87999999999998" stroke="#52514e" stroke-width="1.5"/>
<text x="84" y="102" font-size="16" fill="#52514e" font-weight="400" text-anchor="end">1</text>
<text x="84" y="630" font-size="16" fill="#52514e" font-weight="400" text-anchor="end">0</text>
<text x="912" y="82" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">1 = credit matches</text>
<text x="912" y="102" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">contribution exactly</text>
<text x="34" y="360" font-size="17" fill="#0b0b0b" font-weight="400" text-anchor="middle" transform="rotate(-90 34 360)">How well credit matches contribution</text>
<text x="498" y="690" font-size="17" fill="#0b0b0b" font-weight="400" text-anchor="middle">How widely contribution and trust are spread</text>
<text x="96" y="660" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">held by one household</text>
<text x="900" y="660" font-size="15" fill="#52514e" font-weight="400" text-anchor="end">held across everyone</text>

